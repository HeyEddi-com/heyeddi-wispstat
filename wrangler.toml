# Workspace name
name = "heyeddi-wispstat"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Bindings (IDs omitted for auto-provisioning; filled by Deploy button or setup script)
[[d1_databases]]
binding = "CORE"
database_name = "wispstat-core"
database_id = "6906ae0c-5821-4e92-b927-15796e229647"
migrations_dir = "migrations/core"

[[d1_databases]]
binding = "INGEST"
database_name = "wispstat-ingest"
database_id = "39df2c67-ce87-49ef-be7c-e7b62eb2a644"
migrations_dir = "migrations/ingest"

[[kv_namespaces]]
binding = "SALTS"
id = "e36de2e66f764c8d981604027560a0e5"

# Optional nightly CORE backups — enable after: npx wrangler r2 bucket create wispstat-backups
# [[r2_buckets]]
# binding = "BACKUPS"
# bucket_name = "wispstat-backups"

# Rate limiting (placeholder - actual binding configured via dashboard/CLI)
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"

# Static assets (dashboard + tracker)
[assets]
directory = "./dist/assets"
binding = "ASSETS"
not_found_handling = "single-page-application"
# This Wrangler only accepts a boolean. The Worker passes other paths to ASSETS.
run_worker_first = true

# Cron triggers (hourly, nightly). Weekly Slack digest removed — use MCP.
[triggers]
crons = [
  "5 * * * *",     # hourly: rollups + partition management
  "0 9 * * *",     # nightly: CORE backup to R2 (UTC; configurable)
]

# Workers Logs on for errors/debug; avoid shipping visitor payloads in custom logs.
# Collector still returns 204 with no body; do not console.log beacons.
[observability]
enabled = true
head_sampling_rate = 1

# Vars (non-secret configuration)
[vars]
D1_CORE_DATABASE_ID = "6906ae0c-5821-4e92-b927-15796e229647"
# Optional cookie/origin override. Default: request origin (workers.dev is fine).
# PUBLIC_BASE_URL = "https://heyeddi-wispstat.heyeddi.workers.dev"

DEFAULT_TZ = "UTC"
# App + API + /ws.js stay on *.workers.dev. Marketing is Firebase (wispstat.heyeddi.com).

# Secrets (set via wrangler secret put or Deploy button)
# SETUP_TOKEN - required for first-run claim
# SESSION_SECRET - for local auth session tokens
# TOKEN_KEY - for visit token encryption (v1.2)
# CF_API_TOKEN - optional, for R2 backups
# CF_ACCOUNT_ID - optional, for R2 backups
