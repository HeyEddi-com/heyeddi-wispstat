# Workspace name - will be renamed
name = "edgemetrics"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Bindings (IDs omitted for auto-provisioning)
[[d1_databases]]
binding = "CORE"
database_name = "edgemetrics-core"
database_id = ""
migrations_dir = "migrations/core"

[[d1_databases]]
binding = "INGEST"
database_name = "edgemetrics-ingest"
database_id = ""
migrations_dir = "migrations/ingest"

[[kv_namespaces]]
binding = "SALTS"
id = ""

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "edgemetrics-backups"

# Rate limiting (placeholder - actual binding configured via dashboard/CLI)
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"

# Static assets (dashboard + tracker)
[assets]
directory = "./dist/assets"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/e", "/t", "/a", "/api/*"]

# Cron triggers (hourly, nightly, weekly)
[triggers]
crons = [
  "5 * * * *",     # hourly: rollups + partition management
  "0 9 * * *",     # nightly: CORE backup to R2 (UTC; configurable)
  "0 15 * * MON"   # weekly: digest (UTC; configurable)
]

# Observability disabled on collector routes (privacy)
[observability]
enabled = false

# Vars (non-secret configuration)
[vars]
# Optional: override base URL if not using request.url.origin
# PUBLIC_BASE_URL = "https://your-instance.example.com"

DEFAULT_TZ = "UTC"
AUTH_PROVIDERS = "local"  # "local" | "firebase" | "local,firebase"

# Secrets (set via wrangler secret put or Deploy button)
# SETUP_TOKEN - required for first-run claim
# SESSION_SECRET - for local auth session tokens
# TOKEN_KEY - for visit token encryption (v1.2)
# FIREBASE_PROJECT_ID - if using Firebase auth
# FIREBASE_WEB_CONFIG - JSON string, if using Firebase auth
# SLACK_WEBHOOK_URL - optional, for weekly digest
# CF_API_TOKEN - optional, for R2 backups
# CF_ACCOUNT_ID - optional, for R2 backups
