name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: cd dashboard && npm ci
      - run: cd tracker && npm ci
      - run: cd mcp && npm ci
      - name: No hardcoded product domains (app code)
        run: |
          # Marketing/docs/SECURITY may name the public demo host; app code must stay portable.
          if rg -n "heyeddi\.com|cloudflareworkers\.com" src dashboard tracker mcp; then
            echo "Hardcoded domains found in app code"
            exit 1
          fi
          echo "OK"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: MCP syntax
        run: node --check mcp/src/index.js
      - name: Predeploy gate (no remote secrets)
        run: npm run predeploy -- --skip-secrets
